name: Build and Attest

on:
  push:
    branches: [main]
    
permissions:
  contents: write
  attestations: write
  id-token: write
# TODO: Set permissions to default deny ({})

jobs:
  build:
    runs-on: ubuntu-latest
    # TODO: Add permissions needed for attestation
    #   - id-token: write
    #   - contents: read
    #   - attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build artifact
        run: npm ci && npm run build && tar -czf app.tar.gz public/
    
      
      - name: Generate artifact attestation
        uses: actions/attest@v4              #⬅️ official GitHub action
        with:
          subject-path: 'app.tar.gz'        #⬅️ file the attestation covers


      # TODO: Add actions/attest@v4
      #   - subject-path: 'app.tar.gz'


      - uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: app.tar.gz
